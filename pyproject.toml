[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pc-agent"
version = "0.1.0"
description = "Voice-activated desktop AI automation agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "AI PC Agent Team" }
]
keywords = ["desktop", "automation", "voice", "agent", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "google-genai>=0.5.0",
    "faster-whisper>=1.0.0",
    "pystray>=0.19.0",
    "pyzmq>=25.0.0",
    "pynput>=1.7.0",
    "sounddevice>=0.5.0",
    "numpy>=1.24.0",
    "customtkinter>=5.2.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "watchdog>=3.0.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pyzmq>=25.0.0",
    "crawl4ai>=0.9.0",
    "playwright>=1.49.0",
    "pyyaml>=6.0",
    "PyQt6>=6.2.0",
    "PyQt6-WebEngine>=6.2.0",
    "soundfile>=0.12.0",
    "pydub>=0.25.0",
    "edge-tts>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
ai-pc-agent = "main:main"
ai-pc-agent-tray = "tray:run_tray"
ai-pc-agent-hotkey = "hotkey_listener:main"

[project.urls]
Homepage = "https://github.com/layon/ai-pc-agent"
Repository = "https://github.com/layon/ai-pc-agent"

[tool.setuptools]
py-modules = [
    "app_indexer",
    "audit_log",
    "browser_research",
    "confirmation_widget",
    "consent",
    "context_compactor",
    "failure_modes",
    "hotkey_listener",
    "llm_client",
    "main",
    "main_widget",
    "memory",
    "ollama_client",
    "prompts",
    "registry",
    "research_scraper",
    "research_worker",
    "retrievers",
    "security_audit",
    "settings",
    "settings_panel",
    "skills_manager",
    "status",
    "supervisor",
    "tool_registry",
    "trace_manager",
    "tray",
    "whisper_input",
    "zmq_bus",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.setuptools.data-files]
"share/applications" = ["com.layon.aiagent.desktop"]
